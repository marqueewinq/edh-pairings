[project]
name = "edh-pairings"
version = "1.0.3"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<4",
    "dj-rest-auth>=7,<8",
    "django-cors-headers>=4,<5",
    "django-constance>=4,<5",
    "django-extensions>=3,<4",
    "django-json-widget>=2,<3",
    "django-tinymce>=4,<5",
    "dj-database-url>=2,<3",
    "gunicorn[gevent]>=22,<23",
    "marshmallow>=3,<4",
    "numpy>=1.26,<2",
    "scipy>=1.12,<2",
    "psycopg2-binary>=2.9,<3",
    "pyjwt>=2.13.0,<3",
    "redis>=5,<6",
    "Pillow>=10,<11",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "Faker",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E402", "E501"]

[tool.mypy]
ignore_missing_imports = true
cache_dir = "/dev/null"
disallow_subclassing_any = false

[tool.isort]
profile = "black"
